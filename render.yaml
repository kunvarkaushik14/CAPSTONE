services:
  # -------------------------------------------------------------
  # NEXORA 3.0 Node.js Career Intelligence Backend
  # -------------------------------------------------------------
  - type: web
    name: nexora-node-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # -------------------------------------------------------------
  # NEXORA 3.0 Spring Boot 3 Backend
  # -------------------------------------------------------------
  - type: web
    name: nexora-springboot-backend
    env: docker
    plan: free
    rootDir: springboot-backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
