services:
  # -------------------------------------------------------------
  # NEXORA 3.0 Spring Boot 3 Backend
  # -------------------------------------------------------------
  - type: web
    name: nexora-springboot-backend
    env: docker
    plan: free
    rootDir: springboot-backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
